#:schema ./links.schema.json
# Where each dotfile goes, per platform. See links.schema.json for the format.
# Applied by `uv run scripts/link.py`, and by home.nix on NixOS.

[editorconfig]
source = ".editorconfig"
all = "~/.editorconfig"

[gitconfig]
source = ".gitconfig"
all = "~/.gitconfig"

[gitignore_global]
source = ".gitignore_global"
all = "~/.gitignore_global"

[inputrc]
source = ".inputrc"
all = "~/.inputrc"

[shellcheckrc]
source = ".shellcheckrc"
all = "~/.shellcheckrc"

[tmux]
source = ".tmux.conf"
linux = "~/.tmux.conf"
macos = "~/.tmux.conf"

[blerc]
source = "blerc"
description = "ble.sh settings (status bar, vi cursor shapes)"
linux = "~/.blerc"

[vimrc]
source = ".vimrc"
all = "~/.vimrc"

[bash_aliases]
source = ".personal_bash_aliases"
all = "~/.personal_bash_aliases"

[bash_history_config]
source = ".personal_bash_history_config"
all = "~/.personal_bash_history_config"

[bash_python_utils]
source = ".personal_bash_python_utils"
all = "~/.personal_bash_python_utils"

[nvim]
source = "init.vim"
linux = "~/.config/nvim/init.vim"
macos = "~/.config/nvim/init.vim"
windows = "{localappdata}/nvim/init.vim"

[claude]
source = "claude/CLAUDE.md"
description = "Claude Code global instructions"
all = "~/.claude/CLAUDE.md"

[windows_terminal]
source = "windows-terminal/settings.json"
description = "Windows Terminal settings (profiles, keybindings)"
windows = "{localappdata}/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"

[claude_settings]
source = "claude/settings.json"
description = "Claude Code user settings (deny rules for destructive gh/git commands)"
all = "~/.claude/settings.json"
